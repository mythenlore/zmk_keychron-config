name: Build B1 New-Hardware Test

on:
  workflow_dispatch:
  push:
    paths:
      - "config/keychron_b1_us.keymap"
      - "config/boards/shields/b1_new_hw/**"
      - ".github/workflows/build-b1-new-hw.yml"
      - "0001-esb-nrf-fix.patch"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: docker.io/zmkfirmware/zmk-build-arm:3.2

    steps:
      - name: Checkout config
        uses: actions/checkout@v5

      - name: Initialize West workspace
        run: west init -l config

      - name: Fetch Zephyr modules
        run: west update

      - name: Export Zephyr CMake package
        run: west zephyr-export

      - name: Apply Keychron 2.4 GHz patch
        run: git -C zephyr apply ../0001-esb-nrf-fix.patch

      - name: Build normal B1 firmware for newer matrix
        run: |
          west build -s zmk/app -d build-b1-new -b keychron -p always -- \
            -DSHIELD="keychron_b1_us b1_new_hw" \
            -DZMK_CONFIG=${GITHUB_WORKSPACE}/config \
            -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/keychron_b1_us.keymap

      - name: Verify final Devicetree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("build-b1-new/zephyr/zephyr.dts").read_text()

          kscan = re.search(
              r'kscan0:\s+kscan_matrix\s*\{(?P<body>.*?)\n\t\};',
              text,
              re.S,
          )
          if not kscan:
              raise SystemExit("ERROR: Could not locate kscan0 in zephyr.dts")

          body = kscan.group("body")
          if 'diode-direction = "row2col";' not in body:
              raise SystemExit("ERROR: final kscan0 is not row2col")

          transform = re.search(
              r'default_transform:\s+keymap_transform_0\s*\{(?P<body>.*?)\n\t\};',
              text,
              re.S,
          )
          if not transform:
              raise SystemExit("ERROR: Could not locate default_transform in zephyr.dts")

          tbody = transform.group("body")
          if not re.search(r'columns\s*=\s*<\s*0x12\s*>;', tbody):
              raise SystemExit("ERROR: default_transform does not have 18 columns")
          if not re.search(r'rows\s*=\s*<\s*0x9\s*>;', tbody):
              raise SystemExit("ERROR: default_transform does not have 9 rows")

          m = re.search(r'map\s*=\s*<(?P<map>.*?)>;', tbody, re.S)
          if not m:
              raise SystemExit("ERROR: Could not locate transform map")

          actual = [int(v, 16) for v in re.findall(r'0x[0-9a-fA-F]+', m.group("map"))]
          expected = [1797, 258, 772, 270, 260, 514, 1026, 517, 518, 519, 522, 520, 775, 1288, 17, 256, 271, 257, 774, 268, 269, 1285, 1286, 1287, 1290, 262, 263, 264, 5, 10, 8, 9, 13, 14, 773, 769, 259, 516, 267, 1030, 1031, 1034, 1297, 4, 6, 7, 2, 273, 1544, 266, 770, 265, 1541, 1543, 513, 16, 0, 15, 1, 12, 11, 1798, 1803, 1802, 1800, 1801, 1295, 261, 778, 1553, 3, 1024, 521, 785, 529, 1041, 1809, 2048, 2049, 2050, 2051, 2052]

          if actual != expected:
              raise SystemExit(
                  "ERROR: final transform does not exactly match the measured 77-key map "
                  f"(expected {len(expected)} entries, found {len(actual)})"
              )

          print("PASS: final scanner is row2col")
          print("PASS: final 82-position transform exactly matches measured hardware")
          PY

      - name: Upload firmware and diagnostics
        uses: actions/upload-artifact@v5
        with:
          name: keychron-b1-new-hardware-test
          path: |
            build-b1-new/zephyr/zmk.uf2
            build-b1-new/zephyr/zephyr.dts
            build-b1-new/zephyr/.config
          if-no-files-found: error
