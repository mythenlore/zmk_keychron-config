name: Build B1 Custom-Shield Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "config/b1_matrix_probe.keymap"
      - "config/boards/shields/b1_matrix_probe/**"
      - ".github/workflows/build-matrix-probe.yml"
      - "0001-esb-nrf-fix.patch"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: docker.io/zmkfirmware/zmk-build-arm:3.2

    steps:
      - name: Checkout config
        uses: actions/checkout@v5

      - name: Initialize West workspace
        run: west init -l config

      - name: Fetch Zephyr modules
        run: west update

      - name: Export Zephyr CMake package
        run: west zephyr-export

      - name: Apply Keychron 2.4 GHz patch
        run: git -C zephyr apply ../0001-esb-nrf-fix.patch

      - name: Build diagnostic firmware
        run: |
          west build -s zmk/app -d build-probe -b keychron -p always -- \
            -DSHIELD="keychron_b1_us b1_matrix_probe" \
            -DZMK_CONFIG=${GITHUB_WORKSPACE}/config \
            -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/b1_matrix_probe.keymap

      - name: Verify diagnostic shield reached final Devicetree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("build-probe/zephyr/zephyr.dts").read_text()

          kscan = re.search(
              r'kscan0:\s+kscan_matrix\s*\{(?P<body>.*?)\n\t\};',
              text,
              re.S,
          )
          if not kscan:
              raise SystemExit("ERROR: Could not locate kscan0 in zephyr.dts")

          body = kscan.group("body")
          if 'diode-direction = "row2col";' not in body:
              raise SystemExit("ERROR: kscan0 is not row2col")

          transform = re.search(
              r'default_transform:\s+keymap_transform_0\s*\{(?P<body>.*?)\n\t\};',
              text,
              re.S,
          )
          if not transform:
              raise SystemExit("ERROR: Could not locate default_transform in zephyr.dts")

          tbody = transform.group("body")
          if not re.search(r'rows\s*=\s*<\s*0x9\s*>;', tbody):
              raise SystemExit("ERROR: default_transform does not have 9 rows")

          m = re.search(r'map\s*=\s*<(?P<map>.*?)>;', tbody, re.S)
          if not m:
              raise SystemExit("ERROR: Could not locate transform map")

          values = re.findall(r'0x[0-9a-fA-F]+', m.group("map"))
          if len(values) != 149:
              raise SystemExit(
                  f"ERROR: Expected exhaustive 149-entry transform, found {len(values)}"
              )

          print("PASS: final zephyr.dts contains row2col scanner")
          print("PASS: final zephyr.dts contains exhaustive 149-entry transform")
          PY

      - name: Upload probe diagnostics
        uses: actions/upload-artifact@v5
        with:
          name: keychron-b1-custom-shield-diagnostics
          path: |
            build-probe/zephyr/zmk.uf2
            build-probe/zephyr/zephyr.dts
            build-probe/zephyr/.config
          if-no-files-found: error
